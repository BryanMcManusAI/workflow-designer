name: ci

on:
  push:
  pull_request:

jobs:
  engine:
    name: engine smoke (deterministic, stdlib)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Build index.json from the YAML corpus
        run: python engine/build_index.py
      - name: Smoke-run every mode on a cold clone
        run: |
          python engine/engine.py list
          python engine/engine.py backwards
          python engine/engine.py interrogate
          python engine/engine.py modality-shift --to video
          python engine/engine.py compare --task preference_ranking
          python engine/engine.py cookbook --by domain
      - name: Compile all modules
        run: python -m py_compile engine/engine.py engine/wd_app.py engine/portfolio_app.py engine/build_index.py

  ui:
    name: public demo renders headless
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml streamlit
      - run: python engine/build_index.py
      - name: Render engine/portfolio_app.py via Streamlit AppTest
        run: |
          PYTHONPATH=engine python -c "from streamlit.testing.v1 import AppTest; at = AppTest.from_file('engine/portfolio_app.py', default_timeout=90).run(); assert not at.exception, at.exception; print('portfolio_app render OK -', len(at.markdown), 'markdown blocks')"
