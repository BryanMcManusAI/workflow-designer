id: text-preference-rlhf
title: Pairwise Preference Collection for RLHF
modality: text
task_structure: preference_ranking
annotator_structure: crowd
lineage: generic / canonical RLHF preference collection
qa_mechanism: [gold_honeypots, agreement, qualification_calibration]
failure_signatures: [drift, inflation, unanchored, confounded, priming]
uses_patterns: [gold-honeypots, qualification-calibration, inter-annotator-agreement, human-gold-anchor]

decision: >
  Produce pairwise "A vs B is better" judgments on model responses to train a reward model that
  reflects the intended preference (helpful, harmless, on-instruction).

inputs:
  - source: prompts + paired model responses (A, B)
    provenance: sampled from the policy model under a fixed protocol
    assumption: the pairs are discriminable and span the behaviors you want to shape
  - source: a preference rubric (what "better" means)
    provenance: authored before collection
    assumption: raters internalize the rubric rather than their own taste

actors:
  - role: raters (crowd, qualified)
    does: pick A or B (+ optional strength) per pair
    type: human
  - role: calibration owner
    does: maintain the qualification test + gold pairs
    type: human

steps:
  - qualify raters on a calibration set before live work
  - randomize A/B position per pair to kill position bias
  - raters judge live pairs; honeypot pairs with known answers seeded throughout
  - track per-rater agreement and honeypot accuracy over time
  - re-calibrate / retire raters whose agreement drifts
  - aggregate to preference labels for reward-model training

quality_gates:
  - gate: qualification + calibration
    checks: raters pass a gold set before and during live work
    catches: unanchored, inflation
  - gate: A/B position randomization
    checks: which side is "A" is random
    catches: priming (position bias)
  - gate: honeypots + agreement tracking
    checks: known-answer pairs and inter-rater agreement over time
    catches: drift, bad actors

output:
  shape: preference labels (+ strength, + rater metadata) per pair
  consumed_by: reward-model training; eval of the reward model

failure_modes:
  - signature: drift
    description: >
      Over a long campaign raters fatigue and their bar shifts, so week-6 preferences aren't
      week-1 preferences and the reward model sees a moving target.
    caught_by: honeypots + agreement tracking + re-calibration
  - signature: confounded
    description: >
      Raters prefer the longer/more-formatted response regardless of substance, so the reward
      model learns "longer = better" — a length confound, not a quality signal.
    caught_by: UNGUARDED   # add length-controlled pairs / explicit anti-verbosity rubric item
  - signature: priming
    description: >
      Whichever response is shown first gets a systematic edge.
    caught_by: A/B position randomization
  - signature: inflation
    description: >
      Raters drift toward "they're about equal" or always-A to reduce effort.
    caught_by: qualification + calibration + honeypots
  - signature: unanchored
    description: >
      Without gold pairs you can't tell whether raters track the rubric or their own taste.
    caught_by: human-gold-anchor (gold pairs)

cost_profile:
  throughput: tens of thousands of pairs; crowd-scalable
  bottleneck: calibration-set authoring + rater qualification
  human_cost: spread across a qualified crowd; cheap per pair, expensive to keep calibrated

provenance: >
  Canonical RLHF data practice. The length/verbosity confound and rater drift are well-documented
  open problems, not invented. Self_affinity becomes live the moment a model assists the judging.
