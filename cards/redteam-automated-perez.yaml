id: redteam-automated-perez
title: Red-Teaming — Automated (LM-Generated Attacks)
modality: text
task_structure: red_team
annotator_structure: model_as_annotator
lineage: deepmind / Red-Teaming LMs with LMs (Perez et al. 2022)
qa_mechanism: [agreement]
failure_signatures: [sampling_frame, unanchored, under_specification, self_affinity]
uses_patterns: [model-in-the-loop-adversarial, cross-family-judges]
distinctive: >
  AUTOMATED — a red-team LANGUAGE MODEL generates the test cases (zero-shot / few-shot / SL / RL) and a
  trained classifier detects offensive target responses. Scales far past human red-teamers (uncovered
  tens of thousands of offensive replies in a 280B chatbot) but inherits the red-LM's blind spots.

provenance_meta:
  source: "Perez et al., Red Teaming Language Models with Language Models, arXiv:2202.03286"
  extraction_confidence: high
  provenance: extracted-then-audited
  dedup_hint: "same task as redteam-adversarial-dialogue (Anthropic crowd); this is the DEEPMIND automated variant — LM attacks + classifier instead of humans"

decision: >
  Discover harmful target-model behaviors at scale by generating adversarial test cases with another LM and
  flagging harmful responses with a classifier.

inputs:
  - source: test prompts generated by a red-team LM
    provenance: model-generated (zero-shot to RL-optimized)
    assumption: the red-LM's generations are diverse enough to cover the harm space (the central risk)

actors:
  - role: red-team LM
    does: generate adversarial test questions
    type: model
  - role: harm classifier
    does: flag offensive / harmful target responses
    type: model

steps:
  - generate test cases with the red-LM (escalating: zero-shot → few-shot → supervised → RL)
  - run them against the target model
  - classify target responses for harm
  - cluster / analyze the failures

quality_gates:
  - gate: harm classifier
    checks: automatically label target responses offensive/harmful
    catches: scales detection beyond human throughput [REPORTED]

output:
  shape: large sets of (attack, harmful-response) pairs + failure clusters
  consumed_by: harm measurement; safety fine-tuning

failure_modes:
  - signature: sampling_frame
    evidence: REPORTED
    description: Coverage is bounded by the red-LM's own distribution; it can mode-collapse and miss harm types humans would find.
    caught_by: UNGUARDED (RL diversity objectives help partially)
  - signature: unanchored
    evidence: INFERRED
    description: Harm labels come from a classifier with no human gold in the loop, so its errors propagate silently.
    caught_by: UNGUARDED
  - signature: self_affinity
    evidence: INFERRED
    description: Red-LM, target, and classifier may share a family — blind spots correlate. (Inferred.)
    caught_by: cross-family checks
  - signature: under_specification
    evidence: INFERRED
    description: '"Offensive/harmful" is a fuzzy boundary the classifier encodes implicitly. (Inferred.)'
    caught_by: UNGUARDED

cost_profile:
  throughput: very high — fully automated
  bottleneck: red-LM diversity + classifier accuracy
  human_cost: near-zero at runtime (a welfare advantage vs human red-teaming); humans build the classifier

provenance: >
  Extracted from arXiv:2202.03286. DEEPMIND's automated red-team variant. Compare with the Anthropic
  crowdsourced and OpenAI external-expert ways — automation buys scale + welfare, costs coverage/anchoring.
