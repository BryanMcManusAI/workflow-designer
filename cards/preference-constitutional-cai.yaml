id: preference-constitutional-cai
title: Preference Collection — Anthropic Constitutional AI (RLAIF)
modality: text
task_structure: preference_ranking
annotator_structure: model_as_annotator
lineage: anthropic / Constitutional AI — RLAIF (Bai et al. 2022)
qa_mechanism: [guideline_freeze, agreement]
failure_signatures: [self_affinity, confounded, sampling_frame]
uses_patterns: [lock-then-score, cross-family-judges, model-in-the-loop-adversarial]

provenance_meta:
  source: "Bai et al., Constitutional AI: Harmlessness from AI Feedback, arXiv:2212.08073"
  extraction_confidence: high
  provenance: extracted-then-audited
  dedup_hint: "same task as the other preference cards; the radical variant — harm preferences come from AI feedback against a written constitution, NOT human labels"

distinctive: >
  Harmlessness preferences are generated by an AI judging against a written CONSTITUTION of
  principles — minimizing human harm-labeling. Two stages: (1) supervised self-critique + revise
  (model critiques its own answer per a sampled principle, then rewrites it); (2) RL from AI
  Feedback (RLAIF) — a model picks the better of two responses conditioned on a random principle.
  Humans still provide HELPFULNESS preferences; harms are AI-labeled.

decision: >
  Produce harmlessness preference data WITHOUT human harm labels, by having a model judge responses
  against an explicit written constitution.

inputs:
  - source: model responses to (often red-teaming) prompts
    provenance: generated in-loop
    assumption: a written principle set adequately encodes 'harmless' and the AI applies it faithfully (the central bet)
  - source: a constitution (human-written principles)
    provenance: authored by the lab
    assumption: principles are complete + the judging model isn't systematically biased

actors:
  - role: critic / reviser model
    does: critique its own response against a sampled principle, then revise it (SL stage)
    type: model
  - role: AI feedback model
    does: pick the better of two responses conditioned on a random constitutional principle (RL stage)
    type: model
  - role: humans
    does: still provide HELPFULNESS preferences (only harms are AI-labeled)
    type: human

steps:
  - SL stage: generate response → self-critique per a sampled principle → revise → fine-tune on revisions
  - RL stage: sample two responses → AI picks the better given a random principle → train a preference model (RLAIF)
  - combine AI harmlessness preferences with human helpfulness preferences

quality_gates:
  - gate: explicit written constitution (frozen principles)
    checks: judgments trace to stated principles, not implicit taste
    catches: drift / hidden criteria (lock-then-score on principles) [REPORTED]

output:
  shape: AI-generated harmlessness preference pairs + revised SL data (+ human helpfulness prefs)
  consumed_by: RLAIF / RLHF

failure_modes:
  - signature: self_affinity
    evidence: REPORTED
    description: A model judges model outputs (and even revises its own) — preferences can reflect the judge's family/quirks, not ground-truth harmlessness.
    caught_by: UNGUARDED in-method (cross-family checking would mitigate)
  - signature: confounded
    evidence: REPORTED
    description: The AI may apply a principle via a spurious cue; the principle set, not real harm, drives the label.
    caught_by: explicit constitution (makes the basis legible, not necessarily correct)
  - signature: sampling_frame
    evidence: INFERRED
    description: Coverage is bounded by the constitution + the prompts the model is probed on. (Inferred.)
    caught_by: UNGUARDED

cost_profile:
  throughput: very high — harm preferences are AI-generated, minimal human labeling
  bottleneck: authoring + maintaining the constitution
  human_cost: LOW exposure — AI labels harms, sparing humans the distressing content (a welfare advantage)

provenance: >
  Extracted from arXiv:2212.08073. ANTHROPIC's Constitutional-AI variant — the most distinctive 'way':
  replaces human harm labels with principle-conditioned AI feedback. Trades human welfare cost + scale
  for a self_affinity risk. The compare operator sets it against the human-labeled approaches.
