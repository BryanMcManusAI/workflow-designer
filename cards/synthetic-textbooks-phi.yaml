id: synthetic-textbooks-phi
title: Model-Generated + Model-Filtered Training Data (phi / Textbooks)
modality: text
task_structure: freeform_generation
annotator_structure: model_as_annotator
lineage: gunasekar et al. 2023 (phi-1 / Textbooks Are All You Need)
qa_mechanism: [agreement]
failure_signatures: [confounded, unanchored, sampling_frame]
uses_patterns: [cross-family-judges, dedup-merge]
distinctive: >
  Curate 'textbook-quality' pretraining data with models on BOTH ends: GPT-3.5 GENERATES synthetic textbooks +
  exercises, and GPT-4 acts as a QUALITY FILTER scoring the educational value of web code. No human labeling —
  a tiny, model-curated corpus (a few B tokens) that beats far larger raw-web data (phi-1: 50.6% HumanEval at 1.3B).

provenance_meta:
  source: "Gunasekar et al., Textbooks Are All You Need, arXiv:2306.11644 (phi-1)"
  extraction_confidence: high
  provenance: extracted-then-audited
  dedup_hint: "2nd synthetic-data recipe (after synthetic-with-audit); distinct — fully model-generated + model-FILTERED pretraining data, no human audit step"

decision: >
  Build a small, high-quality training corpus by generating synthetic textbook data and using a strong model to
  filter for educational value, instead of scaling raw web data or human curation.

inputs:
  - source: synthetic textbooks/exercises generated by GPT-3.5
    provenance: model-generated
    assumption: generated content is correct + diverse + non-contaminating (the central bet)
  - source: web code (The Stack / StackOverflow)
    provenance: public code, model-filtered
    assumption: a model can judge 'educational value' reliably

actors:
  - role: generator model (GPT-3.5)
    does: synthesize textbook-quality text + exercises
    type: model
  - role: filter model (GPT-4)
    does: score educational value of web data; keep high-value
    type: model

steps:
  - generate synthetic textbooks + exercises
  - prompt a strong model to rate educational value of web code; keep the high-value subset
  - dedupe; assemble a small curated corpus
  - pretrain on it

quality_gates:
  - gate: model-as-quality-filter
    checks: keep only data a strong model rates educationally valuable
    catches: low-value / noisy web data [REPORTED]

output:
  shape: a small curated (synthetic + filtered-web) pretraining corpus
  consumed_by: pretraining a small competitive model

failure_modes:
  - signature: confounded
    evidence: REPORTED
    description: >
      The phi-1 report (Sec. 5) found a significant portion of its GPT-3.5-generated training data was
      similar to HumanEval test samples — synthetic generation produced contamination resembling the eval
      set; generator + filter sharing model lineage also lets their biases co-propagate into the student.
    caught_by: cross-family generation/filtering (partial)
  - signature: unanchored
    evidence: INFERRED
    description: No human ground-truth on generated content; correctness rests on the generator + a model filter. (Inferred.)
    caught_by: UNGUARDED
  - signature: sampling_frame
    evidence: INFERRED
    description: Diversity is bounded by what the generator can imagine + what the filter calls 'educational'. (Inferred.)
    caught_by: dedupe (spreads, doesn't add missing coverage)

cost_profile:
  throughput: very high — generation + model-filtering, no human labeling
  bottleneck: generation/filtering API cost; contamination auditing
  human_cost: minimal

provenance: >
  Extracted from arXiv:2306.11644. 2nd synthetic-data recipe — model-generated + model-filtered, no human audit.
  Contrast with synthetic-with-audit (model labels + HUMAN audit) and Self-Instruct (instruction bootstrap).
